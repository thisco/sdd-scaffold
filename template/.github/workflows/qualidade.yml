name: Qualidade

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  drift-arquitetura:
    name: Drift de Arquitetura (informativo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyyaml
      - name: Verificar sincronia drawio x tofu x compose
        run: |
          SAIDA=$(python3 -I scripts/verificar_drift_arquitetura.py --raiz .)
          echo "$SAIDA"
          if echo "$SAIDA" | grep -q "divergência"; then
            echo "::warning title=Drift de Arquitetura::${SAIDA//$'\n'/ | }"
          fi

  testes:
    name: Testes automatizados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Instalação congelada: sem lockfile respeitado, o CI testa um conjunto de
      # dependências diferente do da máquina de quem desenvolveu.
      - name: Instalar dependências (congelado)
        run: |
          python -m pip install --upgrade pip
          pip install -r {{ARQUIVO_DEPENDENCIAS}}
      # <!-- preencher: se o projeto não é Python, trocar este job pelo runner da stack
      #      (ex.: `npm ci && npm test`, `mvn -B verify`, `go test ./...`). Mantenha o
      #      princípio: instalação congelada + suíte completa bloqueando o merge. -->
      - name: Suíte completa
        run: pytest tests/ -q

  lint-e-tipos:
    name: Lint, formato e tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff mypy
      # <!-- preencher: ajustar às ferramentas da stack e aos caminhos do projeto. -->
      - name: Lint e formato (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Tipos (mypy)
        continue-on-error: true
        run: mypy . || echo "::warning title=mypy::inconformidades de tipo — ver log do job"

  governanca:
    name: Governança carregável pelos harnesses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # O Codex trunca documentos de projeto em project_doc_max_bytes = 32768 bytes.
      # Um AGENTS.md acima disso é silenciosamente cortado: a constituição perde o fim
      # sem nenhum aviso ao agente ou ao desenvolvedor.
      - name: AGENTS.md dentro do limite de contexto
        run: |
          LIMITE=30000
          TAMANHO=$(wc -c < AGENTS.md)
          echo "AGENTS.md: $TAMANHO bytes (limite de alerta $LIMITE, truncamento real em 32768)"
          if [ "$TAMANHO" -ge "$LIMITE" ]; then
            echo "::error title=AGENTS.md grande demais::$TAMANHO bytes — mova detalhe operacional para docs/steering/"
            exit 1
          fi
      # A constituição é compartilhada entre projetos e não se edita por projeto. O bloco
      # inline no AGENTS.md precisa bater com a cópia canônica em docs/constituicao/.
      - name: Constituição não adulterada
        run: python3 -I scripts/verificar_constituicao.py --raiz .
      # AGENTS.md é a fonte única; os ponteiros de ferramenta precisam apontar para ele.
      - name: Ponteiros de ferramenta íntegros
        run: |
          FALHOU=0
          for PONTEIRO in CLAUDE.md GEMINI.md; do
            if [ ! -f "$PONTEIRO" ]; then
              echo "::error title=Ponteiro ausente::$PONTEIRO não existe"; FALHOU=1; continue
            fi
            grep -q 'AGENTS.md' "$PONTEIRO" || { echo "::error title=Ponteiro quebrado::$PONTEIRO não referencia AGENTS.md"; FALHOU=1; }
          done
          if [ -f ANTIGRAVITY.md ]; then
            echo "::error title=Ponteiro inerte::ANTIGRAVITY.md não é lido por ferramenta alguma — o Antigravity lê AGENTS.md e GEMINI.md"; FALHOU=1
          fi
          exit $FALHOU

  normas-do-pr:
    name: Normas do PR (threat-model, rollback, evidência, migrations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Bloqueia apenas alteração de migration já aplicada, que é inequívoca.
      # Threat-model, rollback e evidência saem como aviso: envolvem julgamento,
      # e portão que reprova por julgamento ensina o time a contorná-lo.
      - name: Verificar normas contra a base do PR
        run: python3 -I scripts/verificar_pr.py --base origin/${{ github.base_ref }}

  segredos:
    name: Varredura de segredos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencias:
    name: Auditoria de dependências (pip-audit)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pip-audit
      - run: pip-audit -r {{ARQUIVO_DEPENDENCIAS}} --strict || echo "::warning title=pip-audit::vulnerabilidades encontradas — ver log do job"
