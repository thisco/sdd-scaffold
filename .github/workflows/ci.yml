name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    name: Testes do gerador
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest pyyaml
      - name: Suíte do gerador
        run: pytest -q

  geracao-real:
    name: Gera projeto e valida o resultado
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: Configurar identidade git (exigida pelo commit inicial)
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
      - name: Gerar projeto de ponta a ponta
        run: |
          python3 criar_projeto.py --nome projeto-ci --destino /tmp/saida \
            --descricao "Projeto de verificação do CI." --stack "Python 3.12"
      - name: O drift check do projeto gerado precisa rodar
        run: python3 /tmp/saida/projeto-ci/scripts/verificar_drift_arquitetura.py --raiz /tmp/saida/projeto-ci
      - name: Nenhum placeholder residual e nenhum artefato de SO
        run: |
          ! grep -rl '{{[A-Z_]*}}' /tmp/saida/projeto-ci --include='*.md' --include='*.yml' --include='*.py' || exit 1
          ! find /tmp/saida/projeto-ci -name .DS_Store -o -name '*.pyc' | grep . || exit 1
